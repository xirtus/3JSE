<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0%" stop-color="#16203a"/>
      <stop offset="100%" stop-color="#060a13"/>
    </radialGradient>
    <linearGradient id="faceTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="faceLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#a21caf"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="504" height="504" rx="104" fill="url(#bgGlow)" stroke="url(#ring)" stroke-width="3"/>

  <!-- three faces, one engine -->
  <g filter="url(#glow)" opacity="0.5">
    <polygon points="256,134 142,200 256,266 370,200" fill="#22d3ee"/>
    <polygon points="142,200 256,266 256,398 142,332" fill="#818cf8"/>
    <polygon points="370,200 256,266 256,398 370,332" fill="#e879f9"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.25" stroke-width="3" stroke-linejoin="round">
    <polygon points="256,134 142,200 256,266 370,200" fill="url(#faceTop)"/>
    <polygon points="142,200 256,266 256,398 142,332" fill="url(#faceLeft)"/>
    <polygon points="370,200 256,266 256,398 370,332" fill="url(#faceRight)"/>
  </g>
</svg>
