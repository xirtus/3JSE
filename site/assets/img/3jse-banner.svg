<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow1" cx="0.22" cy="0.30" r="0.55">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.80" r="0.6">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b3c0d6"/>
    </linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="faceTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="faceLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#a21caf"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#060a13"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- the mark: an isometric cube — three faces, three gradients, the "3" in 3JSE -->
  <g filter="url(#glow)" opacity="0.55">
    <polygon points="300,205 205,260 300,315 395,260" fill="#22d3ee"/>
    <polygon points="205,260 300,315 300,425 205,370" fill="#818cf8"/>
    <polygon points="395,260 300,315 300,425 395,370" fill="#e879f9"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="2" stroke-linejoin="round">
    <polygon points="300,205 205,260 300,315 395,260" fill="url(#faceTop)"/>
    <polygon points="205,260 300,315 300,425 205,370" fill="url(#faceLeft)"/>
    <polygon points="395,260 300,315 300,425 395,370" fill="url(#faceRight)"/>
  </g>

  <!-- wordmark -->
  <text x="480" y="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="150" font-weight="800" letter-spacing="4" fill="url(#tg)">3JSE</text>
  <text x="482" y="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="45" font-weight="600" fill="url(#tag)">The WebGPU-native Game Engine</text>
  <text x="482" y="445" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" fill="#7c8aa0">TypeScript &#183; One Gameplay IR &#183; AI-native &#183; Web-first</text>

  <text x="1160" y="600" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#3f4c63">github.com/xirtus/3JSE</text>
</svg>
